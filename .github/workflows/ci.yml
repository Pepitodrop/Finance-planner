name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund --no-audit --silent
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Capture TypeScript diagnostics
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc -b --pretty false > typescript-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typescript-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce TypeScript result
        if: steps.typescript.outputs.exit_code != '0'
        run: |
          cat typescript-diagnostics.txt
          exit 1
      - name: Production bundle
        run: npx vite build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  connector-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: server
        run: npm test
      - name: Syntax validation
        run: |
          node --check server/src/server.js
          node --check server/src/providers.js
          node --check server/src/crypto-store.js
          node --check server/src/security.js

  cobol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gnucobol
      - run: cobc -Wall -Wextra -m core/cobol/finance_projection.cob
