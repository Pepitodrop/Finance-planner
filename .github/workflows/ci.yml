name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund --no-audit --silent
      - name: Capture unit-test diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose > unit-test-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit-test diagnostics
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce unit-test result
        if: steps.tests.outputs.exit_code != '0'
        run: |
          cat unit-test-diagnostics.txt
          exit 1
      - name: Capture TypeScript diagnostics
        if: always()
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc -b --pretty false > typescript-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always() && steps.typescript.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typescript-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce TypeScript result
        if: always() && steps.typescript.outputs.exit_code != '0'
        run: |
          cat typescript-diagnostics.txt
          exit 1
      - name: Production bundle
        run: npx vite build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  connector-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: finance_planner_test
          POSTGRES_USER: finance_planner
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_planner -d finance_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finance_planner:ci-postgres-password@127.0.0.1:5432/finance_planner_test
      COBOL_BANKING_BINARY: ${{ github.workspace }}/build/banking-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install GnuCOBOL and PostgreSQL 17 client
        shell: bash
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          /usr/lib/postgresql/17/bin/pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 17\.'
      - name: Verify PostgreSQL 17 client resolution
        shell: bash
        run: |
          test "$(command -v pg_dump)" = "/usr/lib/postgresql/17/bin/pg_dump"
          test "$(command -v pg_restore)" = "/usr/lib/postgresql/17/bin/pg_restore"
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 17\.'
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --no-fund --no-audit --silent
      - name: Compile authoritative COBOL engines
        run: |
          mkdir -p build
          cobc -Wall -Wextra -x -o build/transaction-rules core/cobol/transaction_rules.cob
          cobc -Wall -Wextra -x -o build/banking-core core/cobol/banking/banking-core.cob
      - name: Capture backend-test diagnostics
        id: backend_tests
        continue-on-error: true
        working-directory: server
        shell: bash
        run: |
          set +e
          npm test > backend-test-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload backend-test diagnostics
        if: always() && steps.backend_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: server/backend-test-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce backend-test result
        if: steps.backend_tests.outputs.exit_code != '0'
        working-directory: server
        run: |
          cat backend-test-diagnostics.txt
          exit 1
      - name: Verify standalone migration command
        working-directory: server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run migrate
      - name: Backend production dependency audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax validation
        run: |
          node --check server/src/server.js
          node --check server/src/auth-router.js
          node --check server/src/auth-store.js
          node --check server/src/providers.js
          node --check server/src/cobol-engine.js
          node --check server/src/cobol-banking-core.js
          node --check server/src/crypto-store.js
          node --check server/src/database.js
          node --check server/src/postgres-store.js
          node --check server/src/user-state-store.js
          node --check server/src/finance-router.js
          node --check server/src/migrate.js
          node --check server/src/security.js
          node --check server/src/runtime-security.js
          node --check server/src/ai-router.js
          node --check server/src/huggingFaceClient.js

  cobol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gnucobol
      - name: Compile COBOL financial modules
        run: |
          mkdir -p build
          cobc -Wall -Wextra -m core/cobol/finance_projection.cob
          cobc -Wall -Wextra -x -o build/transaction-rules core/cobol/transaction_rules.cob
          cobc -Wall -Wextra -x -o build/banking-core core/cobol/banking/banking-core.cob
      - name: Verify COBOL transaction rules
        run: |
          test "$(build/transaction-rules NORMALIZE -1299)" = "OK|expense|1299"
          test "$(build/transaction-rules NORMALIZE 250000)" = "OK|income|250000"
          test "$(build/transaction-rules APPLY 100000 1299 expense)" = "OK|98701"
          test "$(build/transaction-rules APPLY 98701 5000 income)" = "OK|103701"
      - name: Verify COBOL banking rules
        shell: bash
        run: |
          set -euo pipefail
          account_output="$(build/banking-core normalize-account-type Girokonto)"
          card_type_output="$(build/banking-core normalize-account-type Kreditkarte)"
          balance_output="$(build/banking-core normalize-credit-card -12550 50000 -2000)"
          printf 'account output: <%s>\n' "$account_output"
          printf 'card type output: <%s>\n' "$card_type_output"
          printf 'balance output: <%s>\n' "$balance_output"
          test "$account_output" = "OK|checking"
          test "$card_type_output" = "OK|credit-card"
          test "$balance_output" = "OK|12550|-12550|35450|2000"
          if build/banking-core normalize-credit-card -12550 50000 >/tmp/banking-invalid.out 2>&1; then
            echo "banking-core accepted an invalid argument count"
            exit 1
          fi
          echo "invalid-argument output:"
          cat /tmp/banking-invalid.out || true

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -f Dockerfile.web -t finance-planner-web:ci .
          docker build -f Dockerfile.server -t finance-planner-connector:ci .
      # Pinned by commit SHA (v0.36.0, released after aquasecurity/trivy-action's
      # March 2026 supply-chain compromise of all prior tags) rather than a mutable
      # tag, since a security-scanning action is a high-value target for exactly
      # this kind of attack.
      - name: Scan web image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-planner-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan connector image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-planner-connector:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Validate Compose configuration
        env:
          AUTH_MODE: google
          SESSION_SECRET: ci-session-secret-with-at-least-32-characters
          CONNECTOR_MASTER_KEY: ci-master-key-with-at-least-32-characters
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet
