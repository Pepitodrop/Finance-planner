name: Hosted AI acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      require_live_ai:
        description: Require configured Hugging Face credentials and successful live inference
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL: Qwen/Qwen3-4B-Thinking-2507:fastest
      HF_MODEL_REVISION: 768f209d9ea81521153ed38c47d515654e938aea
      HF_RECEIPT_MODEL: Qwen/Qwen2.5-VL-7B-Instruct:fastest
      REQUIRE_LIVE_AI_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_ai || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted text and receipt inference
        run: node scripts/live-ai-acceptance.mjs
      - name: Upload hosted AI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-ai-acceptance
          path: artifacts/live-ai-acceptance.json
          if-no-files-found: error
          retention-days: 30
