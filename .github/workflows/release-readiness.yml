name: Controlled production release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semver release tag to create after all readiness gates pass (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 15
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Production releases must be dispatched from the main branch, not $DISPATCH_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve verified main commit
        id: main
        run: |
          git fetch origin main --tags --force
          git checkout --detach origin/main
          main_sha="$(git rev-parse origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$main_sha" || {
            echo "Checked-out commit does not match origin/main"
            exit 1
          }
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release_tag must be a semantic version beginning with v"
            exit 1
          }
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-fund --no-audit --silent
      - name: Run normal verification
        run: npm test
      - name: Enforce all release evidence gates
        run: npm run verify:release
      - name: Ensure main did not advance during verification
        env:
          VERIFIED_MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          git fetch origin main --force
          current_main_sha="$(git rev-parse origin/main)"
          if [ "$current_main_sha" != "$VERIFIED_MAIN_SHA" ]; then
            echo "main advanced during release verification; rerun against the new commit"
            exit 1
          fi
      - name: Create governed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIED_MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: gh release create "$RELEASE_TAG" --target "$VERIFIED_MAIN_SHA" --generate-notes
