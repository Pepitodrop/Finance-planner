services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      connector:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    pids_limit: 100
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_planner}
      POSTGRES_USER: ${POSTGRES_USER:-finance_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_planner} -d ${POSTGRES_DB:-finance_planner}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    stop_grace_period: 60s
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  connector:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # The connector is only ever reachable via the web/nginx container on
      # this network (its published host port is loopback-only). nginx is
      # therefore always a trusted proxy here, not an operator choice.
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AUTH_MODE: ${AUTH_MODE:-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_MASTER_KEY: ${AUTH_MASTER_KEY:-}

      # Governed hosted Hugging Face reasoning
      HF_TOKEN: ${HF_TOKEN:-}
      HF_TIMEOUT_MS: ${HF_TIMEOUT_MS:-30000}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-4B-Thinking-2507:fastest}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-768f209d9ea81521153ed38c47d515654e938aea}
      HF_CRITIC_ENABLED: ${HF_CRITIC_ENABLED:-false}
      HF_CRITIC_MODEL: ${HF_CRITIC_MODEL:-Qwen/Qwen3-4B-Instruct-2507:fastest}
      HF_CRITIC_MODEL_REVISION: ${HF_CRITIC_MODEL_REVISION:-1b4199c4f36b0cef378bfb12390c18780c18af4c}
      HF_BUDGET_MODEL: ${HF_BUDGET_MODEL:-Qwen/Qwen3-4B-Instruct-2507:fastest}
      HF_BUDGET_TIMEOUT_MS: ${HF_BUDGET_TIMEOUT_MS:-30000}
      HF_RECEIPT_MODEL: ${HF_RECEIPT_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct:fastest}
      HF_RECEIPT_TIMEOUT_MS: ${HF_RECEIPT_TIMEOUT_MS:-45000}
      PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-false}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CONNECTOR_MASTER_KEY: ${CONNECTOR_MASTER_KEY:?Set CONNECTOR_MASTER_KEY in .env}
      CONNECTOR_STORE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance_planner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_planner}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      SENSITIVE_RATE_LIMIT_PER_MINUTE: ${SENSITIVE_RATE_LIMIT_PER_MINUTE:-20}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-15000}
      HEADERS_TIMEOUT_MS: ${HEADERS_TIMEOUT_MS:-10000}
      KEEP_ALIVE_TIMEOUT_MS: ${KEEP_ALIVE_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
      GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_SECRET: ${PAYPAL_WEBHOOK_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
    ports:
      - "127.0.0.1:${CONNECTOR_PORT:-8787}:8787"
    volumes:
      - connector-data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  connector-data:
