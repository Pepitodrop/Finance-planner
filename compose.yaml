services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      connector:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  connector:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AUTH_MODE: ${AUTH_MODE:-local}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CONNECTOR_MASTER_KEY: ${CONNECTOR_MASTER_KEY:?Set CONNECTOR_MASTER_KEY in .env}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
      GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
    ports:
      - "127.0.0.1:${CONNECTOR_PORT:-8787}:8787"
    volumes:
      - connector-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  connector-data:
