server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Shared by every location that proxies to the connector.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /health/ready {
    access_log off;
    proxy_pass http://connector:8787/health/ready;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }

  # Full encrypted finance vaults may be larger than ordinary API requests.
  # The connector independently enforces the same 10 MB upper bound and then
  # validates the complete state before it reaches PostgreSQL.
  location = /api/finance/state {
    proxy_pass http://connector:8787;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    client_max_body_size 10m;
  }

  location /api/ {
    proxy_pass http://connector:8787;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    client_max_body_size 2m;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    expires 1h;
    try_files $uri =404;
  }

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    expires 1h;
    try_files $uri =404;
  }

  location ^~ /vendor/ {
    types {
      application/javascript js mjs;
      application/wasm wasm;
    }
    default_type application/octet-stream;
    expires -1;
    try_files $uri =404;
  }

  location ~* ^/(assets|icons)/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
