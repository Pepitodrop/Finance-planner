server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # Shared by every location that proxies to the connector.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Browser/runtime connectivity probes must reach the connector rather than
  # falling through to the SPA shell. Returning index.html here makes the
  # browser parse HTML as health JSON and permanently report a false degraded
  # connection even while the service is healthy.
  location = /health/live {
    access_log off;
    proxy_pass http://connector:8787/health/live;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }

  location = /health/ready {
    access_log off;
    proxy_pass http://connector:8787/health/ready;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }

  # Full encrypted finance vaults may be larger than ordinary API requests.
  # The connector independently enforces the same 10 MB upper bound and then
  # validates the complete state before it reaches PostgreSQL.
  location = /api/finance/state {
    proxy_pass http://connector:8787;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    client_max_body_size 10m;
  }

  location /api/ {
    proxy_pass http://connector:8787;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    client_max_body_size 2m;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    expires 1h;
    try_files $uri =404;
  }

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    expires 1h;
    try_files $uri =404;
  }

  location ^~ /vendor/ {
    types {
      application/javascript js mjs;
      application/wasm wasm;
    }
    default_type application/octet-stream;
    expires -1;
    try_files $uri =404;
  }

  location ~* ^/(assets|icons)/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # The HTML shell must revalidate on every navigation so a new release cannot
  # remain pinned behind an old asset manifest or service-worker registration.
  location = /index.html {
    expires -1;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
