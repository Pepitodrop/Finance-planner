# Shared security header set for the web/nginx entry point.
#
# nginx does not merge add_header directives across scopes: any location
# block that declares its own add_header (e.g. to set a location-specific
# Cache-Control) stops inheriting every add_header from its parent server
# block, not just the one it redeclares. Every such location must
# `include` this file so the security headers survive alongside its own
# add_header lines instead of silently disappearing.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.simpleicons.org; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
