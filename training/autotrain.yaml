task: text_classification
base_model: distilbert/distilbert-base-multilingual-cased
project_name: finance-planner-transaction-classifier
log: tensorboard
backend: local

data:
  path: ./training/data
  train_split: train
  valid_split: validation
  column_mapping:
    text_column: text
    target_column: target

params:
  max_seq_length: 96
  epochs: 4
  batch_size: 16
  lr: 0.00003
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  mixed_precision: fp16
  eval_strategy: epoch
  save_total_limit: 2
  early_stopping_patience: 2
  push_to_hub: false
